plugins {
    id 'com.android.application'
}

android {
    namespace 'com.emsfield.fieldtester'
    compileSdk 35

    defaultConfig {
        applicationId 'com.emsfield.fieldtester'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-poc'
        // play-services-ads 가 64K 메서드를 넘긴다. minSdk 21+ 는 런타임 multidex.
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation project(':core')
    // UMP(user-messaging-platform)는 이 아티팩트가 함께 가져온다. 배너만 사용한다.
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
}
